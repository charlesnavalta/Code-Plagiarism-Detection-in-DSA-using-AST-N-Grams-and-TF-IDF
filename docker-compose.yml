services:
  # ----------------------------
  # 1. DATABASE (MySQL)
  # ----------------------------
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    # 🌟 NEW: Tells Docker how to check if MySQL is actually ready to accept connections
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  # ----------------------------
  # 2. PYTHON BACKEND (Flask)
  # ----------------------------
  backend:
    build: ./server
    container_name: backend
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      # 🌟 THE FIX: Map uploads to a real folder so student code is never lost
      - ./server/uploads:/app/uploads 
    env_file:
      # 🌟 Ensures Docker reads the env file from the same folder as this yaml file
      - .env 
    depends_on:
      # 🌟 NEW: Forces the backend to wait until the DB healthcheck passes
      db:
        condition: service_healthy
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1 # 🌟 NEW: Forces Flask to auto-reload when you save a .py file!
      - AUTO_SEED=true

  # ----------------------------
  # 3. REACT FRONTEND
  # ----------------------------
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
    stdin_open: true
    tty: true
    depends_on:
      - backend

  # ----------------------------
  # 4. DATABASE UI (phpMyAdmin)
  # ----------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_ui
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db

volumes:
  db_data: