version: "3.8"

services:
  # ----------------------------
  # 1. PYTHON BACKEND (Flask)
  # ----------------------------
  backend:
    build: ./server
    container_name: backend
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/uploads
    environment:
      - FLASK_ENV=development

  # ----------------------------
  # 2. REACT FRONTEND (Merged)
  # ----------------------------
  frontend:
    # We use the 'build' context because you have a custom Dockerfile in /client
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: frontend
    
    # This command logic comes from your uploaded file
    command: sh -c "npm install && npm start"
    
    ports:
      - "3000:3000"
    
    volumes:
      - ./client:/app
      - /app/node_modules
    
    # These settings fix hot-reloading on Windows
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
    
    stdin_open: true
    tty: true
    depends_on:
      - backend