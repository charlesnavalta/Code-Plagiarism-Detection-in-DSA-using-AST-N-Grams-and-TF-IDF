<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="url(#accent-grad)" stroke-width="2.5" />
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#glow-grad)" />

  <!-- Central Academic / AST Shield Structure -->
  <g transform="translate(0, 1)">
    <!-- Top Cap / Diamond -->
    <path d="M32 14 L50 23 L32 32 L14 23 Z" fill="url(#accent-grad)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- AST Branching Tree Links -->
    <path d="M32 32 L44 26.5 L44 38 A12 12 0 0 1 32 49 A12 12 0 0 1 20 38 L20 26.5 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Internal AST Core Nodes -->
    <circle cx="32" cy="37" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="26" cy="43" r="2" fill="#a855f7" />
    <circle cx="38" cy="43" r="2" fill="#a855f7" />
    <line x1="32" y1="37" x2="26" y2="43" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="32" y1="37" x2="38" y2="43" stroke="#38bdf8" stroke-width="1.5" />
  </g>
</svg>
