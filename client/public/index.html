<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falsicode</title>

    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#030712">

    <!-- SEO & Discoverability -->
    <meta name="description" content="Falsicode is a free academic platform for detecting code plagiarism in Data Structures and Algorithms using Abstract Syntax Tree (AST) analysis, N-Gram tokenization, and TF-IDF similarity scoring.">
    <meta name="keywords" content="code plagiarism detection, AST analysis, TF-IDF, N-Gram, DSA, academic integrity, computer science education">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Falsicode">
    <link rel="canonical" href="https://falsicode.vercel.app">

    <!-- Open Graph (Social sharing) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Falsicode">
    <meta property="og:description" content="Free academic platform for structural code similarity analysis using AST, N-Gram, and TF-IDF. Built for CS educators and students.">
    <meta property="og:url" content="https://falsicode.vercel.app">
    <meta property="og:site_name" content="Falsicode">

    <!-- Analytics Tracking Disclosure:
         Falsicode does NOT use any third-party analytics, advertising trackers,
         or behavioral profiling scripts. No Google Analytics, Meta Pixel, or
         similar services are loaded on this page. Only strictly necessary
         browser localStorage is used (auth token, user role, theme preference).
         See Cookie Policy at /cookies for full details. -->

    <!-- Prevent Flash of Unstyled Content (FOUC) / White Flash on Refresh -->
    <style>
        html, body {
            background-color: #030712;
            color: #f9fafb;
            margin: 0;
            padding: 0;
        }
        html[data-theme='light'], body[data-theme='light'] {
            background-color: #f1f5f9;
            color: #334155;
        }
    </style>
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('app-theme') || 'dark';
                var theme = saved;
                if (saved === 'system') {
                    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.backgroundColor = theme === 'light' ? '#f1f5f9' : '#030712';
            } catch(e) {}
        })();
    </script>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
</body>
</html>
