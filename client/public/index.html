<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicGuard - Batch Plagiarism Analysis</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f7f6;
            --white: #ffffff;
            --red-high: #d32f2f;
            --green-low: #388e3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            color: #333;
        }

        .container {
            background-color: var(--white);
            width: 100%;
            max-width: 800px;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 { color: var(--primary); text-align: center; margin: 0 0 0.5rem 0; font-size: 2rem; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 2.5rem; }

        /* UPLOAD SECTION */
        .upload-box {
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            background: #fafafa;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
            position: relative;
        }
        
        .upload-box:hover { border-color: var(--accent); background: #f0f8ff; }

        .upload-label {
            display: block;
            padding: 3rem 1rem;
            text-align: center;
            cursor: pointer;
            width: 100%;
            height: 100%;
            box-sizing: border-box; 
        }

        .upload-label strong { font-size: 1.2rem; color: var(--primary); display: block; margin-bottom: 5px; }
        .upload-label small { color: #95a5a6; }

        button, .btn-restart {
            width: 100%;
            padding: 1.2rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: block;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }
        button:hover, .btn-restart:hover { background-color: var(--accent); }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }

        /* RESULTS TABLE */
        .results-section { margin-top: 1rem; display: none; } /* Hidden by default */
        h3 { border-bottom: 2px solid #eee; padding-bottom: 10px; color: var(--primary); margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: var(--primary); color: var(--white); font-weight: 600; }
        tr:hover { background-color: #f8f9fa; }

        .high { color: var(--red-high); font-weight: bold; }
        .low { color: var(--green-low); font-weight: bold; }
        
        .summary-box {
            background: #e8f8f5;
            border: 1px solid #d1f2eb;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 30px;
            color: var(--green-low);
            display: none;
        }

        .empty-state {
            text-align: center;
            color: var(--green-low);
            padding: 20px;
            background: #e8f8f5;
            border-radius: 8px;
            border: 1px solid #d1f2eb;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>LogicGuard Batch Processor</h1>
        <p class="subtitle">Upload all student files to detect cross-plagiarism.</p>

        <div id="inputSection">
            <form id="uploadForm">
                <div class="upload-box">
                    <label for="submissions" class="upload-label">
                        <strong id="file-label-text">Click to Select Class Submissions</strong>
                        <small>Hold Ctrl/Cmd to select multiple .py or .txt files</small>
                    </label>
                    
                    <input type="file" name="submissions" id="submissions" accept=".py,.txt" multiple required style="display: none;" 
                           onchange="updateLabel(this)">
                </div>

                <button type="submit" id="submitBtn">Run Batch Analysis</button>
            </form>
        </div>

        <div id="resultsArea">
            <div class="summary-box" id="summaryBox">
                <h3 style="border:none; margin:0; padding:0;">✅ Analysis Complete</h3>
                <p style="margin: 5px 0 0 0;">Successfully processed <strong id="fileCountDisplay">0</strong> files.</p>
            </div>

            <div class="results-section" id="resultsSection">
                <h3>Analysis Results</h3>
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>File A</th>
                            <th>File B</th>
                            <th>Similarity</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>

            <div class="empty-state" id="emptyState">
                <h3>No Plagiarism Detected</h3>
                <p>All submitted files appear to be unique.</p>
            </div>

            <button onclick="location.reload()" class="btn-restart" id="restartBtn" style="margin-top: 30px; display: none;">Start New Analysis</button>
        </div>
    </div>

    <script>
        function updateLabel(input) {
            const count = input.files.length;
            const label = document.getElementById('file-label-text');
            if (count > 0) {
                label.innerText = count + " Files Selected";
                label.style.color = "#27ae60";
            } else {
                label.innerText = "Click to Select Class Submissions";
                label.style.color = "#2c3e50";
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fileInput = document.getElementById('submissions');
            if(fileInput.files.length < 2) {
                alert("Please select at least 2 files.");
                return;
            }

            // Show Loading State
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Analyzing... (Please Wait)";
            btn.disabled = true;
            btn.style.backgroundColor = "#95a5a6";

            // Prepare Data
            const formData = new FormData();
            for (const file of fileInput.files) {
                formData.append('submissions', file);
            }

            try {
                // Connect to API
                const response = await fetch('http://localhost:5000/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const results = await response.json();

                // HIDE Input, SHOW Results
                document.getElementById('inputSection').style.display = 'none';
                document.getElementById('restartBtn').style.display = 'block';

                // Update Summary
                document.getElementById('summaryBox').style.display = 'block';
                document.getElementById('fileCountDisplay').innerText = fileInput.files.length;

                const tableBody = document.querySelector('#resultsTable tbody');
                tableBody.innerHTML = ''; // Clear old results

                if (results.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                } else {
                    document.getElementById('resultsSection').style.display = 'block';
                    
                    // Build Table Rows Dynamically
                    results.forEach(row => {
                        const isHigh = row.score > 70;
                        const classType = isHigh ? 'high' : 'low';
                        const statusText = isHigh ? 'High Risk' : 'Safe / Low';

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row.file1}</td>
                            <td>${row.file2}</td>
                            <td><span class="${classType}">${row.score}%</span></td>
                            <td><span class="${classType}">${statusText}</span></td>
                        `;
                        tableBody.appendChild(tr);
                    });
                }

            } catch (error) {
                alert("Error connecting to server! Is Docker running?");
                console.error(error);
                btn.innerText = "Run Batch Analysis";
                btn.disabled = false;
                btn.style.backgroundColor = "#2c3e50";
            }
        });
    </script>

</body>
</html>
